<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Clone</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:black;
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 50px;
background:#111;
position:sticky;
top:0;
}

.logo{
color:red;
font-size:35px;
font-weight:bold;
}

nav a{
color:white;
margin:15px;
text-decoration:none;
font-size:18px;
}

.hero{
height:90vh;
background:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1920') center/cover;
display:flex;
align-items:center;
padding-left:60px;
}

.hero-content{
width:500px;
background:rgba(0,0,0,0.6);
padding:20px;
border-radius:10px;
}

.hero h1{
font-size:50px;
margin-bottom:15px;
}

.hero p{
line-height:25px;
margin-bottom:20px;
}

button{
padding:12px 30px;
background:red;
border:none;
color:white;
font-size:18px;
cursor:pointer;
border-radius:5px;
}

.movies{
padding:30px;
}

.movies h2{
margin-bottom:20px;
}

.row{
display:flex;
overflow-x:auto;
gap:20px;
}

.card{
min-width:450px;
background:#111;
padding:10px;
border-radius:10px;
transition:.5s;
}

.card:hover{
transform:scale(1.05);
}

iframe{
width:100%;
height:250px;
border-radius:10px;
}

.title{
padding:10px;
font-size:18px;
text-align:center;
}
</style>

</head>
<body>

<header>
<div class="logo">NETFLIX</div>

<nav>
<a href="#">Home</a>
<a href="#">Movies</a>
<a href="#">Series</a>
<a href="#">Trending</a>
</nav>
</header>


<section class="hero">

<div class="hero-content">

<h1>Watch Unlimited Movies</h1>

<p>
Enjoy action, thriller, sci-fi and adventure trailers directly inside website.
</p>

<button onclick="scrollToMovies()">
Watch Now
</button>

</div>

</section>


<section class="movies" id="movieSection">

<h2>Trending Trailers</h2>

<div class="row">

<div class="card">

<iframe
src="https://www.youtube.com/embed/TcMBFSGVi1c"
allowfullscreen>
</iframe>

<div class="title">
Avengers Endgame
</div>

</div>


<div class="card">

<iframe
src="https://www.youtube.com/embed/EXeTwQWrcwY"
allowfullscreen>
</iframe>

<div class="title">
The Dark Knight
</div>

</div>


<div class="card">

<iframe
src="https://www.youtube.com/embed/5PSNL1qE6VY"
allowfullscreen>
</iframe>

<div class="title">
Avatar
</div>

</div>


<div class="card">

<iframe
src="https://www.youtube.com/embed/JfVOs4VSpmA"
allowfullscreen>
</iframe>

<div class="title">
Spider Man
</div>

</div>


<div class="card">

<iframe
src="https://www.youtube.com/embed/QdBZY2fkU-0"
allowfullscreen>
</iframe>

<div class="title">
Interstellar
</div>

</div>

</div>

</section>

<script>

function scrollToMovies(){

document.getElementById(
"movieSection"
).scrollIntoView(
{behavior:"smooth"}
);

}

</script>

</body>
</html>
